<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tally</title>
</head>
<body>

  <div id="app" class="app">
    <header class="app-header">
      <div class="app-header-row">
        <h1>Tally</h1>
        <button type="button" id="settingsBtn" class="btn-icon" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <p id="greeting" class="greeting"></p>
    </header>

    <div id="permissionBanner" class="permission-banner" hidden>
      <p>Turn on notifications so Tally can actually remind you.</p>
      <button id="enableNotifsBtn" class="btn-small">Enable</button>
    </div>

    <form id="addForm" class="add-form">
      <div class="add-form-row">
        <input type="text" id="nameInput" placeholder="What do you need to remember?" required maxlength="60">
        <button type="button" id="micBtn" class="btn-mic" aria-label="Add by voice">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
      </div>
      <input type="time" id="timeInput" required>
      <span id="voiceTimeHint" class="voice-time-hint" hidden>Please confirm this guessed time</span>
      <div id="recurrenceFields" class="recurrence-fields"></div>
      <button type="submit" id="addBtn" class="btn-add">Add</button>
    </form>

    <div id="voiceOverlay" class="voice-overlay" hidden>
      <div class="voice-overlay-card">
        <div id="voiceIndicator" class="voice-indicator">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p id="voiceStatus" class="voice-status">Listening…</p>
        <p id="voiceTranscript" class="voice-transcript"></p>
        <div class="voice-actions">
          <button type="button" id="voiceCancelBtn" class="btn-cancel">Cancel</button>
          <button type="button" id="voiceDoneBtn" class="btn-save">Done</button>
        </div>
      </div>
    </div>

    <div id="emptyState" class="empty-state">
      <p id="emptyStateMessage"></p>
      <p class="empty-sub">Add something above to get started.</p>
    </div>

    <div id="reminderList" class="reminder-list"></div>
  </div>

  <div id="onboardingScreen" class="fullscreen-overlay" hidden>
    <div class="fullscreen-card">
      <h2>What should we call you?</h2>
      <p class="fullscreen-sub">Tally will use it to personalize reminders and greetings. It's stored only on this device.</p>
      <input type="text" id="onboardingNameInput" placeholder="Your name" maxlength="30" autocomplete="given-name">
      <button type="button" id="onboardingContinueBtn" class="btn-add" disabled>Continue</button>
      <button type="button" id="onboardingSkipBtn" class="btn-text">Skip</button>
    </div>
  </div>

  <div id="settingsScreen" class="fullscreen-overlay" hidden>
    <div class="fullscreen-card">
      <div class="settings-header">
        <h2>Settings</h2>
        <button type="button" id="settingsCloseBtn" class="btn-icon" aria-label="Close settings">✕</button>
      </div>
      <label class="settings-label" for="settingsNameInput">Your name</label>
      <input type="text" id="settingsNameInput" placeholder="Not set" maxlength="30" autocomplete="given-name">
    </div>
  </div>

  <div id="milestoneModal" class="milestone-modal" hidden>
    <div class="milestone-modal-card">
      <p id="milestoneMessage" class="milestone-message"></p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
