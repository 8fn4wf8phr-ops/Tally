<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tally</title>
</head>
<body>

  <div id="app" class="app">
    <header class="app-header">
      <h1>Tally</h1>
    </header>

    <div id="permissionBanner" class="permission-banner" hidden>
      <p>Turn on notifications so Tally can actually remind you.</p>
      <button id="enableNotifsBtn" class="btn-small">Enable</button>
    </div>

    <form id="addForm" class="add-form">
      <input type="text" id="nameInput" placeholder="What do you need to remember?" required maxlength="60">
      <input type="time" id="timeInput" required>
      <div id="recurrenceFields" class="recurrence-fields"></div>
      <button type="submit" id="addBtn" class="btn-add">Add</button>
    </form>

    <div id="emptyState" class="empty-state">
      <p>Nothing yet.</p>
      <p class="empty-sub">Add something above to get started.</p>
    </div>

    <div id="reminderList" class="reminder-list"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
